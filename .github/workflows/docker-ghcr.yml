# GitHub Actions workflow for Docker build and push to GHCR
# - On PR: builds and pushes pr-<number>-<shortsha> and pr-<number>-latest tags
# - On main: builds and pushes latest and sha-<shortsha> tags
# - On release: builds and pushes stable and v<semver> tags
# - Attaches SBOM and provenance
# - Uses only GITHUB_TOKEN (no PAT)
# - No deploys or runtime orchestration

name: Build and Push Docker Image to GHCR

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr,prefix=pr-,suffix=-${{ github.sha }},enable=true,priority=100
            type=ref,event=pr,prefix=pr-,suffix=-latest,enable=true,priority=90
            type=sha,enable=true,priority=80,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }},priority=70
            type=raw,value=stable,enable=${{ github.event_name == 'release' }},priority=60
            type=semver,pattern=v{{version}},enable=${{ github.event_name == 'release' }},priority=50
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at || github.event.release.published_at }}

      - name: Build and push Docker image
        id: buildpush
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Show image digest
        run: |
          echo "Image digest: ${{ steps.buildpush.outputs.digest }}"
