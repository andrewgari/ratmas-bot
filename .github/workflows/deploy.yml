name: Deploy to Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy on Unraid
    # MAKE SURE your runner actually has the 'unraid' label!
    # If not, use: runs-on: [self-hosted, ratmas]
    runs-on: [self-hosted, unraid] 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Create .env file for the bot to use
      - name: Create .env file
        run: |
          touch .env
          echo "DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}" >> .env
          echo "DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}" >> .env
          echo "DISCORD_GUILD_ID=${{ secrets.DISCORD_GUILD_ID }}" >> .env
          echo "PARTICIPANT_ROLE_ID=${{ secrets.PARTICIPANT_ROLE_ID }}" >> .env
          echo "MANAGER_USER_ID=${{ secrets.MANAGER_USER_ID }}" >> .env
          echo "REDIS_HOST=redis" >> .env
          echo "REDIS_PORT=6379" >> .env
          
          # Simple check to ensure variables aren't empty
          if grep -q "=$" .env; then
            echo "Error: One or more secrets are empty!"
            exit 1
          fi

      # 2. Build and Deploy
      # Note: This requires a 'docker-compose.yml' in your repo root
      - name: Build and Deploy
        run: |
          # Pulls base images, builds your code, recreates containers
          docker compose up -d --build --force-recreate --remove-orphans

      # 3. Cleanup to save space on Unraid
      - name: Prune old images
        run: docker image prune -f

      # 4. Health Check
      - name: Health Check
        run: |
          echo "Waiting for bot to stabilize..."
          sleep 10
          
          # Print logs for debugging
          docker compose logs --tail=20
          
          # Check if the container is running. 
          # Ensure your service name in docker-compose.yml is actually 'bot' or 'ratmas-bot'
          # If your service is named 'app' or 'worker', change 'bot' below to match.
          if [ -z "$(docker compose ps -q bot)" ]; then
            echo "❌ Bot container is not running!"
            exit 1
          else
            echo "✅ Bot is online!"
          fi
