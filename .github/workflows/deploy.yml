name: Deploy to Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy on Unraid
    # MAKE SURE your runner actually has the 'unraid' label!
    # If not, use: runs-on: [self-hosted, ratmas]
    runs-on: [self-hosted, unraid] 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Create .env file for the bot to use
      - name: Create .env file
        run: |
          touch .env
          
          # Function to safely check and write secrets
          check_secret() {
            if [ -z "$2" ]; then
              echo "❌ ERROR: Secret $1 is EMPTY or MISSING!"
            else
              echo "✅ $1 is set (length: ${#2})"
              echo "$1=$2" >> .env
            fi
          }

          # 1. Write the secrets (and check them one by one)
          check_secret "DISCORD_TOKEN" "${{ secrets.DISCORD_TOKEN }}"
          check_secret "DISCORD_CLIENT_ID" "${{ secrets.DISCORD_CLIENT_ID }}"
          check_secret "DISCORD_GUILD_ID" "${{ secrets.DISCORD_GUILD_ID }}"
          check_secret "PARTICIPANT_ROLE_ID" "${{ secrets.PARTICIPANT_ROLE_ID }}"
          check_secret "MANAGER_USER_ID" "${{ secrets.MANAGER_USER_ID }}"
          
          # 2. Write the non-secrets
          echo "REDIS_HOST=redis" >> .env
          echo "REDIS_PORT=6379" >> .env
          echo "MESSAGE_COMBINE_WINDOW_SECONDS=5" >> .env

          # 3. Final Fail-Safe
          # If the file has fewer lines than variables, fail the build
          EXPECTED_LINES=8
          ACTUAL_LINES=$(wc -l < .env)
          if [ "$ACTUAL_LINES" -lt "$EXPECTED_LINES" ]; then
             echo "🚨 CRITICAL: .env file is incomplete! Stopping deployment."
             exit 1
          fi

      # 2. Build and Deploy
      # Note: This requires a 'docker-compose.yml' in your repo root
      - name: Build and Deploy
        # We inject the secrets directly into the shell here
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          PARTICIPANT_ROLE_ID: ${{ secrets.PARTICIPANT_ROLE_ID }}
          MANAGER_USER_ID: ${{ secrets.MANAGER_USER_ID }}
          MESSAGE_COMBINE_WINDOW_SECONDS: 5
        run: |
          # The variables above are now available to docker compose
          docker compose up -d --build --force-recreate --remove-orphans

      # 3. Cleanup to save space on Unraid
      - name: Prune old images
        run: docker image prune -f

      # 4. Health Check
      - name: Health Check
        run: |
          echo "Waiting for bot to stabilize..."
          sleep 10
          
          # Print logs for debugging
          docker compose logs --tail=20
          
          # Check if the container is running. 
          # Ensure your service name in docker-compose.yml is actually 'bot' or 'ratmas-bot'
          # If your service is named 'app' or 'worker', change 'bot' below to match.
          if [ -z "$(docker compose ps -q bot)" ]; then
            echo "❌ Bot container is not running!"
            exit 1
          else
            echo "✅ Bot is online!"
          fi
