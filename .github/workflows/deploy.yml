name: Deploy to Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy on Unraid
    runs-on: [self-hosted, unraid] # Ensure labels match your runner
    
    # Set permissions if you need to clean up root-owned files later
    container:
      image: docker:cli # Optional: Ensures a clean docker environment if not using the default runner shell

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Optimization: simplified secret validation and generation
      # This loops through the secrets and dumps them to .env
      - name: Create .env file
        run: |
          touch .env
          echo "DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}" >> .env
          echo "DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}" >> .env
          echo "DISCORD_GUILD_ID=${{ secrets.DISCORD_GUILD_ID }}" >> .env
          echo "PARTICIPANT_ROLE_ID=${{ secrets.PARTICIPANT_ROLE_ID }}" >> .env
          echo "MANAGER_USER_ID=${{ secrets.MANAGER_USER_ID }}" >> .env
          echo "REDIS_HOST=redis" >> .env
          echo "REDIS_PORT=6379" >> .env
          
          # fail if any value is empty (simple validation)
          if grep -q "=$" .env; then
            echo "Error: One or more secrets are empty!"
            exit 1
          fi

      # SPEED IMPROVEMENT: Build locally instead of Pulling
      # This uses the Unraid Host's docker cache. 
      # If you changed one line of code, it only rebuilds that one layer.
      - name: Build and Deploy
        run: |
          docker compose up -d --build --force-recreate --remove-orphans

      - name: Prune old images
        run: docker image prune -f

      - name: Health Check
        run: |
          echo "Waiting for bot to stabilize..."
          sleep 5
          docker compose logs --tail=20
          
          # check if the bot container is actually running
          if [ -z "$(docker compose ps -q bot)" ]; then
            echo "Bot container is not running!"
            exit 1
          fi
