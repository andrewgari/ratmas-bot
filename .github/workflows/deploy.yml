name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  deploy:
    name: Deploy via Docker Compose
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.DISCORD_TOKEN }}" ]; then
            echo "Error: DISCORD_TOKEN secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.DISCORD_CLIENT_ID }}" ]; then
            echo "Error: DISCORD_CLIENT_ID secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.DISCORD_GUILD_ID }}" ]; then
            echo "Error: DISCORD_GUILD_ID secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.PARTICIPANT_ROLE_ID }}" ]; then
            echo "Error: PARTICIPANT_ROLE_ID secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.MANAGER_USER_ID }}" ]; then
            echo "Error: MANAGER_USER_ID secret is not set"
            exit 1
          fi

      - name: Create .env file from secrets
        run: |
          cat > .env << EOF
          DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_GUILD_ID=${{ secrets.DISCORD_GUILD_ID }}
          PARTICIPANT_ROLE_ID=${{ secrets.PARTICIPANT_ROLE_ID }}
          MANAGER_USER_ID=${{ secrets.MANAGER_USER_ID }}
          REDIS_HOST=redis
          REDIS_PORT=6379
          EOF
          chmod 600 .env

      - name: Pull Docker images
        run: docker compose pull

      - name: Stop existing containers
        run: docker compose down

      - name: Start services
        run: docker compose up -d

      - name: Clean up old images
        run: docker image prune -f

      - name: Check service health
        run: |
          echo "Waiting for services to be ready..."
          sleep 10
          echo "Checking Redis health..."
          docker compose exec redis redis-cli ping
          echo "Checking container status..."
          docker compose ps
          echo "Recent bot logs:"
          docker compose logs --tail=50 bot
