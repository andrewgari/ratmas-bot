name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Check which files changed to determine if we need to run checks
  check-changes:
    name: Check Changes
    runs-on: ubuntu-latest
    outputs:
      production: ${{ steps.filter.outputs.production }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for production file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            production:
              - 'src/**'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'requirements.txt'
              - 'pyproject.toml'

  # Parallel checks
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: check-changes

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        if: needs.check-changes.outputs.production == 'true'

      - name: Setup Python
        uses: actions/setup-python@v5
        if: needs.check-changes.outputs.production == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: needs.check-changes.outputs.production == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Lint with flake8
        if: needs.check-changes.outputs.production == 'true'
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check formatting with black
        if: needs.check-changes.outputs.production == 'true'
        run: black --check src

      - name: Check import sorting with isort
        if: needs.check-changes.outputs.production == 'true'
        run: isort --check-only src

      - name: Skip - No production changes
        if: needs.check-changes.outputs.production != 'true'
        run: echo "Skipping lint checks - no production file changes detected"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check-changes

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        if: needs.check-changes.outputs.production == 'true'

      - name: Setup Python
        uses: actions/setup-python@v5
        if: needs.check-changes.outputs.production == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: needs.check-changes.outputs.production == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check imports and syntax
        if: needs.check-changes.outputs.production == 'true'
        run: python -m py_compile src/**/*.py

      - name: Skip - No production changes
        if: needs.check-changes.outputs.production != 'true'
        run: echo "Skipping build checks - no production file changes detected"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check-changes

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        if: needs.check-changes.outputs.production == 'true'

      - name: Setup Python
        uses: actions/setup-python@v5
        if: needs.check-changes.outputs.production == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: needs.check-changes.outputs.production == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests
        if: needs.check-changes.outputs.production == 'true'
        run: |
          # Create tests directory if it doesn't exist
          mkdir -p tests
          # Run pytest (will pass if no tests found)
          pytest tests/ -v --cov=src --cov-report=term-missing || echo "No tests found, skipping"

      - name: Skip - No production changes
        if: needs.check-changes.outputs.production != 'true'
        run: echo "Skipping tests - no production file changes detected"

  # Sequential: Build Docker after checks pass
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [check-changes, lint, build, test]
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-metadata: ${{ steps.build.outputs.metadata }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        if: needs.check-changes.outputs.production == 'true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: needs.check-changes.outputs.production == 'true'

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v5
        if: needs.check-changes.outputs.production == 'true'
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ratmas-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/ratmas-bot.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        if: needs.check-changes.outputs.production == 'true'
        with:
          name: docker-image
          path: /tmp/ratmas-bot.tar
          retention-days: 1

      - name: Skip - No production changes
        if: needs.check-changes.outputs.production != 'true'
        run: echo "Skipping Docker build - no production file changes detected"
